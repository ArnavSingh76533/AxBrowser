name: Telegram session

# Optional, one-time helper. The nightly CI uploads over MTProto with the bot token
# (api_id + api_hash + bot token) and needs no saved session. Running it once removes
# the fresh bot login from every build, which is worth doing if Telegram ever starts
# rate-limiting repeated authorizations - and it is required if this bot's own session
# is refused for large files and you supply a user-account session instead.
#
# How to use:
#   1. Make sure the TELEGRAM_API_ID / TELEGRAM_API_HASH / TELEGRAM_BOT_TOKEN secrets exist.
#   2. Actions -> "Telegram session" -> Run workflow.
#   3. Download the "telegram-session" artifact, copy the string it contains into the
#      TELEGRAM_SESSION_STRING repository secret, then delete the artifact.
#   4. Nothing else changes - scripts/telegram_upload.py prefers the session when set.

on:
  workflow_dispatch:
    inputs:
      login:
        description: 'Log in as (bot = uses TELEGRAM_BOT_TOKEN, user = interactive phone login, needs a terminal, run locally instead)'
        required: true
        default: bot
        type: choice
        options:
          - bot
          - user

permissions:
  contents: read

jobs:
  session:
    name: Generate Telegram session string
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Generate session string
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '22138159' }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      run: |
        if [ -z "$TELEGRAM_API_HASH" ]; then
          echo "::error::TELEGRAM_API_HASH is not set. Add it in Settings -> Secrets and variables -> Actions."
          exit 1
        fi
        if [ '${{ inputs.login }}' = 'user' ]; then
          echo "::error::A user session needs an interactive phone/code login - run 'python3 scripts/telegram_upload.py --make-session --login-user' on your own machine."
          exit 1
        fi
        python3 -m pip install --quiet --disable-pip-version-check "telethon>=1.36"
        python3 scripts/telegram_upload.py --make-session --session-out telegram.session.txt
        echo "Session generated. Download the artifact below, copy it into the TELEGRAM_SESSION_STRING secret, then delete the artifact."
        {
          echo "### Telegram session generated"
          echo ""
          echo "Copy the contents of \`telegram.session.txt\` into the **TELEGRAM_SESSION_STRING**"
          echo "repository secret (Settings -> Secrets and variables -> Actions), then delete"
          echo "this workflow's artifact so the credential is not left lying around."
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload session artifact
      uses: actions/upload-artifact@v4
      with:
        name: telegram-session
        path: telegram.session.txt
        retention-days: 1
