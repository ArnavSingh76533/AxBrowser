name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        gradle-version: '8.6'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.6 --no-daemon
        fi

    - name: Build Debug APK (capture log)
      run: |
        set +e
        ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build_output.log 2>&1
        echo "BUILD_EXIT_CODE=$?" >> "$GITHUB_ENV"
        tail -c 60000 /tmp/build_output.log > build_debug_log.txt
        exit 0

    - name: Push captured build log for debugging
      if: always()
      run: |
        git config user.email "ci-debug@axbrowser.local"
        git config user.name "CI Debug Bot"
        git fetch origin ci-debug-logs 2>/dev/null || true
        git checkout -B ci-debug-logs
        mkdir -p .ci-debug
        mv build_debug_log.txt ".ci-debug/build-${{ github.sha }}.txt" 2>/dev/null || true
        git add .ci-debug
        git commit -m "CI debug log for ${{ github.sha }}" || echo "nothing to commit"
        git push origin ci-debug-logs --force

    - name: Fail if build actually failed
      run: |
        if [ "$BUILD_EXIT_CODE" != "0" ]; then
          echo "Build failed with exit code $BUILD_EXIT_CODE"
          exit 1
        fi

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Run Android Lint
      run: ./gradlew lintDebug --no-daemon --continue || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AxBrowser-debug-${{ github.sha }}
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ github.sha }}
        path: '**/build/reports/tests/'
        retention-days: 7

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-report-${{ github.sha }}
        path: '**/build/reports/lint-results*.html'
        retention-days: 7
