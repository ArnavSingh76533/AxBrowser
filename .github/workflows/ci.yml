name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  # Manual re-run: lets you re-test the Telegram upload (after changing the Telegram
  # secrets, say) without pushing a commit. Only main re-runs publish/report - the
  # Telegram step below accepts workflow_dispatch on main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  telegram:
    # Fast non-blocking preflight (about a minute, runs next to the build instead of
    # after it): proves the MTProto credentials can actually log the bot in and resolve
    # the chat, and creates the reusable session for the upload step. Without this, a
    # Telegram credential problem only showed up at the very end of a ~20 minute build.
    name: Telegram preflight
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Restore Telegram MTProto session
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ax-telegram.session
        key: ax-telegram-session-v2

    - name: Install Telethon
      run: python3 -m pip install --quiet --disable-pip-version-check "telethon>=1.36"

    - name: Check Telegram credentials (login + chat)
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '22138159' }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '3fe4592e4cad72f366b6c564505f2d57' }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "::warning::Telegram secrets not set, skipping the preflight."
          exit 0
        fi
        python3 scripts/telegram_upload.py --check \
          --session-file "${RUNNER_TEMP}/ax-telegram.session"

  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Mark job start
      id: t0
      # Timestamp only, so the Telegram summary can report how long the build took.
      run: echo "T0=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        gradle-version: '8.6'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.6 --no-daemon
        fi

    - name: Compute nightly version
      id: nightlyversion
      run: |
        # Every push to main is a new "nightly" build - version by run number so it
        # always advances (1.0.<run_number>), letting the in-app update checker
        # correctly tell "installed" from "just built".
        echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace -PaxVersionName=${{ steps.nightlyversion.outputs.VERSION }} -PaxVersionCode=${{ github.run_number }}

    - name: Run Unit Tests
      id: tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Run Android Lint
      id: lint
      run: ./gradlew lintDebug --no-daemon --continue || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      # Fixed name (not per-sha) + overwrite:true + short retention: GitHub only ever keeps ONE
      # copy of this artifact at a time now, instead of accumulating a new ~120MB blob on every
      # push. That accumulation (116 old artifacts, ~6GB) is what tripped "Artifact storage quota
      # has been hit" and started failing every upload. Telegram (below) is now the real
      # distribution channel; this is just a same-day debug copy for convenience.
      continue-on-error: true
      with:
        name: AxBrowser-debug-latest
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 1
        overwrite: true

    - name: Publish rolling nightly release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        SIGNED_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        cp "$SIGNED_APK" "AxBrowser-nightly.apk"

    - name: Create/update nightly GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      # Non-blocking: this is a convenience "latest nightly" pointer, not the actual deliverable
      # (Telegram below, and the per-commit APK from "Upload Debug APK", already cover that).
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly build v${{ steps.nightlyversion.outputs.VERSION }}"
        body: "Automatic build from the latest commit on main (${{ github.sha }}). This is the debug-signed build (package id ends in .debug) - installing over a previous nightly updates it in place."
        prerelease: true
        files: AxBrowser-nightly.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore Telegram MTProto session
      # Optional: the bot login (api_id + api_hash + bot token) works with no saved
      # session, but Telegram rate-limits repeated sign-ins and every CI run comes from a
      # fresh IP, so the session created by the first successful upload is cached here and
      # reused from then on. Nothing here is required for the upload to work.
      continue-on-error: true
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/ax-telegram.session
        key: ax-telegram-session-v2

    - name: Send APK to Telegram (whole file, MTProto)
      if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      # Uploads the ACTUAL APK, not a link. The HTTP Bot API (api.telegram.org) hard-caps
      # sendDocument at 50MB, which this ~120MB debug APK always exceeds, so the upload goes
      # over MTProto via Telethon (scripts/telegram_upload.py) where the same bot can send up
      # to 2GB. The api_id/api_hash defaults below are the app the bot was created under; a
      # TELEGRAM_API_HASH secret overrides the baked-in one, and the bot token + chat id are
      # secrets only. If MTProto is refused the script degrades to the Bot API and finally to
      # an info message with the release link, so a Telegram hiccup can never fail the build
      # (continue-on-error below).
      # Captions are capped by Telegram at 1024 UTF-16 units (4096 for plain messages); the
      # script trims to fit instead of letting the API reject the upload.
      continue-on-error: true
      env:
        TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID || '22138159' }}
        TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH || '3fe4592e4cad72f366b6c564505f2d57' }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
        VERSION: ${{ steps.nightlyversion.outputs.VERSION }}
        RUN_NUMBER: ${{ github.run_number }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
        RUN_ID: ${{ github.run_id }}
        JOB_START: ${{ steps.t0.outputs.T0 }}
        TESTS: ${{ steps.tests.outcome }}
        LINT: ${{ steps.lint.outcome }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
      run: |
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "Telegram secrets not set, skipping."
          exit 0
        fi
        python3 -m pip install --quiet --disable-pip-version-check "telethon>=1.36"

        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        BYTES=$(stat -c%s "$APK")
        MB=$(awk -v b="$BYTES" 'BEGIN { printf "%.1f", b / 1048576 }')
        SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/nightly/AxBrowser-nightly.apk"
        NOW=$(date -u '+%d %b %Y %H:%M')
        ELAPSED=$(( $(date +%s) - ${JOB_START:-$(date +%s)} ))
        # Only the first line of the commit message, so a multi-paragraph body can't push the
        # caption over Telegram's 1024-unit cap (the script trims as a final safety net).
        SUBJECT=$(printf '%s' "${COMMIT_MSG:-manual run}" | head -n1 | cut -c1-160)

        # Written to a file rather than passed as an argument/env value: the caption is
        # multi-line and may contain quotes, % or $( ) from the commit subject.
        CAPTION_FILE="${RUNNER_TEMP}/telegram-caption.txt"
        printf '🚀 AxBrowser nightly v%s (debug)\n\n📦 AxBrowser-nightly.apk · %s MB · %s bytes\n🔐 SHA-256 %s\n🔖 versionCode %s · build #%s\n🌿 %s @ %s\n🕒 %s UTC · CI took %dm %ds\n✅ unit tests: %s · lint: %s\n📝 %s\n🧾 commit: https://github.com/%s/commit/%s\n⚙️ run: https://github.com/%s/actions/runs/%s\n⬇️ %s' \
          "$VERSION" "$MB" "$BYTES" "$SHA256" "$RUN_NUMBER" "$RUN_NUMBER" \
          "$REF_NAME" "${SHA:0:7}" "$NOW" "$((ELAPSED / 60))" "$((ELAPSED % 60))" \
          "$TESTS" "$LINT" "$SUBJECT" "$REPO" "$SHA" "$REPO" "$RUN_ID" "$DOWNLOAD_URL" \
          > "$CAPTION_FILE"

        python3 scripts/telegram_upload.py \
          --file "$APK" \
          --caption-file "$CAPTION_FILE" \
          --session-file "${RUNNER_TEMP}/ax-telegram.session" \
          --fallback-url "$DOWNLOAD_URL"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-results-latest
        path: '**/build/reports/tests/'
        retention-days: 1
        overwrite: true

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: lint-report-latest
        path: '**/build/reports/lint-results*.html'
        retention-days: 1
        overwrite: true
