name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        gradle-version: '8.6'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.6 --no-daemon
        fi

    - name: Compute nightly version
      id: nightlyversion
      run: |
        # Every push to main is a new "nightly" build - version by run number so it
        # always advances (1.0.<run_number>), letting the in-app update checker
        # correctly tell "installed" from "just built".
        echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace -PaxVersionName=${{ steps.nightlyversion.outputs.VERSION }} -PaxVersionCode=${{ github.run_number }}

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Run Android Lint
      run: ./gradlew lintDebug --no-daemon --continue || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      # Fixed name (not per-sha) + overwrite:true + short retention: GitHub only ever keeps ONE
      # copy of this artifact at a time now, instead of accumulating a new ~120MB blob on every
      # push. That accumulation (116 old artifacts, ~6GB) is what tripped "Artifact storage quota
      # has been hit" and started failing every upload. Telegram (below) is now the real
      # distribution channel; this is just a same-day debug copy for convenience.
      continue-on-error: true
      with:
        name: AxBrowser-debug-latest
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 1
        overwrite: true

    - name: Send build to Telegram
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      # Primary distribution channel. continue-on-error because a Telegram API hiccup (or a
      # >50MB APK, which Telegram's sendDocument caps at) shouldn't fail the build/test signal -
      # the code already compiled and passed tests by this point regardless of whether this send
      # succeeds.
      continue-on-error: true
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_SHA: ${{ github.sha }}
        VERSION: ${{ steps.nightlyversion.outputs.VERSION }}
      run: |
        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "Telegram secrets not set, skipping."
          exit 0
        fi
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        # Telegram caption is capped at 1024 chars and caption text is sent as a form field, not
        # interpolated into a shell command, so a commit message containing quotes/backticks/$()
        # can't do anything unexpected here. printf (not an embedded literal newline) keeps every
        # line of this step properly indented as valid YAML.
        CAPTION=$(printf 'AxBrowser nightly v%s\nCommit: %s\n\n%s' "$VERSION" "${COMMIT_SHA:0:7}" "$COMMIT_MSG")
        CAPTION="${CAPTION:0:1024}"
        curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
          -F "chat_id=${CHAT_ID}" \
          -F "document=@${APK}" \
          -F "caption=${CAPTION}"

    - name: Publish rolling nightly release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        SIGNED_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        cp "$SIGNED_APK" "AxBrowser-nightly.apk"

    - name: Create/update nightly GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      # Non-blocking: this is a convenience "latest nightly" pointer, not the actual deliverable
      # (Telegram above, and the per-commit APK from "Upload Debug APK", already cover that).
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly build v${{ steps.nightlyversion.outputs.VERSION }}"
        body: "Automatic build from the latest commit on main (${{ github.sha }}). This is the debug-signed build (package id ends in .debug) - installing over a previous nightly updates it in place."
        prerelease: true
        files: AxBrowser-nightly.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-results-latest
        path: '**/build/reports/tests/'
        retention-days: 1
        overwrite: true

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: lint-report-latest
        path: '**/build/reports/lint-results*.html'
        retention-days: 1
        overwrite: true
