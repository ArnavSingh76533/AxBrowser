name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
        gradle-version: '8.6'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.6 --no-daemon
        fi

    - name: Compute nightly version
      id: nightlyversion
      run: |
        # Every push to main is a new "nightly" build - version by run number so it
        # always advances (1.0.<run_number>), letting the in-app update checker
        # correctly tell "installed" from "just built".
        echo "VERSION=1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace -PaxVersionName=${{ steps.nightlyversion.outputs.VERSION }} -PaxVersionCode=${{ github.run_number }}

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

    - name: Run Android Lint
      run: ./gradlew lintDebug --no-daemon --continue || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      # Fixed name (not per-sha) + overwrite:true + short retention: GitHub only ever keeps ONE
      # copy of this artifact at a time now, instead of accumulating a new ~120MB blob on every
      # push. That accumulation (116 old artifacts, ~6GB) is what tripped "Artifact storage quota
      # has been hit" and started failing every upload. Telegram (below) is now the real
      # distribution channel; this is just a same-day debug copy for convenience.
      continue-on-error: true
      with:
        name: AxBrowser-debug-latest
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 1
        overwrite: true

    - name: Publish rolling nightly release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        SIGNED_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        cp "$SIGNED_APK" "AxBrowser-nightly.apk"

    - name: Create/update nightly GitHub Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      # Non-blocking: this is a convenience "latest nightly" pointer, not the actual deliverable
      # (Telegram below, and the per-commit APK from "Upload Debug APK", already cover that).
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly build v${{ steps.nightlyversion.outputs.VERSION }}"
        body: "Automatic build from the latest commit on main (${{ github.sha }}). This is the debug-signed build (package id ends in .debug) - installing over a previous nightly updates it in place."
        prerelease: true
        files: AxBrowser-nightly.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Send build to Telegram
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      # Sends a message with a direct download LINK, not the APK file itself. Telegram's Bot API
      # (the standard api.telegram.org endpoint, as opposed to running your own local Bot API
      # server) hard-caps sendDocument at 50MB - this debug APK is ~120MB, so a direct upload
      # gets rejected with 413 Request Entity Too Large every time, no amount of retrying or
      # compression fixes that (the APK is already a compressed zip archive). The GitHub release
      # asset published in the previous step (public, no auth needed to download) is the actual
      # file host; this step runs after it so the link is guaranteed live.
      continue-on-error: true
      env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        COMMIT_SHA: ${{ github.sha }}
        VERSION: ${{ steps.nightlyversion.outputs.VERSION }}
        REPO: ${{ github.repository }}
      run: |
        if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
          echo "Telegram secrets not set, skipping."
          exit 0
        fi
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        SIZE_MB=$(du -m "$APK" | cut -f1)
        DOWNLOAD_URL="https://github.com/${REPO}/releases/download/nightly/AxBrowser-nightly.apk"
        # Message text is capped at 4096 chars and sent as a form field, not interpolated into a
        # shell command, so a commit message containing quotes/backticks/$() can't do anything
        # unexpected here. printf (not an embedded literal newline) keeps this step's YAML valid.
        TEXT=$(printf 'AxBrowser nightly v%s (%sMB)\nCommit: %s\n\n%s\n\nDownload: %s' \
          "$VERSION" "$SIZE_MB" "${COMMIT_SHA:0:7}" "$COMMIT_MSG" "$DOWNLOAD_URL")
        TEXT="${TEXT:0:4096}"
        curl -sS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
          -F "chat_id=${CHAT_ID}" \
          -F "text=${TEXT}"

    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: test-results-latest
        path: '**/build/reports/tests/'
        retention-days: 1
        overwrite: true

    - name: Upload Lint Report
      uses: actions/upload-artifact@v4
      if: always()
      continue-on-error: true
      with:
        name: lint-report-latest
        path: '**/build/reports/lint-results*.html'
        retention-days: 1
        overwrite: true
